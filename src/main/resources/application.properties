spring.application.name=spectraVisionPisip

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/spectraVision
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.show-sql=true

# Correo para recuperacion de contrasena (configurar via variables de entorno)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL de la pagina del front donde el usuario define la nueva contrasena (recibe ?token=...)
app.frontend.reset-password-url=${FRONTEND_RESET_URL:http://localhost:8081/reset-password}
